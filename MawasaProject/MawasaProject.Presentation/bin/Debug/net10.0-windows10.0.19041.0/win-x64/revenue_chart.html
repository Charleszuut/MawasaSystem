<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revenue Chart</title>
<script src="chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F8FBFF;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #chart-container {
    width: 100%;
    height: 100%;
    max-height: 260px;
  }
</style>
</head>
<body>
<div id="chart-container">
  <canvas id="revenueChart"></canvas>
</div>

<script>
  var ctx = document.getElementById('revenueChart').getContext('2d');
  var chart = null;

  function renderChart(labels, data) {
    if (chart) { chart.destroy(); }
    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Revenue',
          data: data,
          backgroundColor: 'rgba(46, 110, 235, 0.75)',
          borderColor: 'rgba(46, 110, 235, 1)',
          borderWidth: 1.5,
          borderRadius: 6,
          borderSkipped: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                return 'P' + Number(context.raw).toLocaleString('en-PH', { minimumFractionDigits: 2 });
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { color: '#54677A', font: { size: 11 } }
          },
          y: {
            grid: { color: '#EAF0F8' },
            ticks: {
              color: '#54677A',
              font: { size: 11 },
              callback: function(value) {
                if (value >= 1000) return '₱' + (value / 1000).toFixed(0) + 'k';
                return '₱' + value;
              }
            }
          }
        },
        animation: {
          duration: 500,
          easing: 'easeInOutQuart'
        }
      }
    });
  }

  // Called from MAUI via WebView.EvaluateJavaScriptAsync
  function updateChart(jsonData) {
    try {
      var d = JSON.parse(jsonData);
      renderChart(d.labels, d.values);
    } catch(e) {
      console.error('Chart update error', e);
    }
  }

  // Render empty placeholder on load
  renderChart([], []);
</script>
</body>
</html>
