<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics Chart</title>
<script src="chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #chart-container {
    position: relative;
    width: 170px;
    height: 170px;
  }
  #center-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 20px;
    font-weight: bold;
    color: #2D67E1;
  }
</style>
</head>
<body>
<div id="chart-container">
  <canvas id="analyticsChart"></canvas>
  <div id="center-text">0%</div>
</div>

<script>
  var ctx = document.getElementById('analyticsChart').getContext('2d');
  var chart = null;

  function renderChart(collected, outstanding, rateLabel) {
    document.getElementById('center-text').innerText = rateLabel;

    if (chart) { chart.destroy(); }
    
    // If there's no data, show a default empty circle
    if (collected === 0 && outstanding === 0) {
      outstanding = 1;
    }

    chart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Collected', 'Outstanding'],
        datasets: [{
          data: [collected, outstanding],
          backgroundColor: ['rgba(45, 103, 225, 1)', 'rgba(233, 239, 248, 1)'],
          borderWidth: 0,
          hoverOffset: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '75%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                var val = context.raw;
                if (val === 1 && collected === 0 && outstanding === 1) return 'No Data';
                return 'P' + Number(val).toLocaleString('en-PH', { minimumFractionDigits: 2 });
              }
            }
          }
        },
        animation: {
          duration: 800,
          easing: 'easeOutBounce'
        }
      }
    });
  }

  // Called from MAUI via WebView.EvaluateJavaScriptAsync
  function updateChart(jsonData) {
    try {
      var d = JSON.parse(jsonData);
      renderChart(d.collected, d.outstanding, d.rateLabel);
    } catch(e) {
      console.error('Chart update error', e);
    }
  }

  // Render empty placeholder on load
  renderChart(0, 0, '0%');
</script>
</body>
</html>
